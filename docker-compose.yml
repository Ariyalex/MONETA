services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [moneta-net]

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    cap_add:
      - NET_RAW # dibutuhkan untuk probe ICMP
    networks: [moneta-net]

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - promdata:/prometheus
    depends_on: [blackbox]
    networks: [moneta-net]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      BACKEND_URL: http://backend:3000
    depends_on: [prometheus]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [moneta-net]

  backend:
    build:
      context: ./backend
      target: dev
    container_name: moneta-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai-service:80
      TARGETS_DIR: /app/targets
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./monitoring/targets:/app/targets # backend menulis (rw), prometheus membaca (ro)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e-",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [moneta-net]

  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on: [backend]
    networks: [moneta-net]

networks:
  moneta-net:

volumes:
  pgdata:
  promdata:
  backend_node_modules:
